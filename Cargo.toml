[workspace]
resolver = "2"
members = [
    "crates/orbit-core",
    "crates/orbit-cli",
    "crates/orbit-app",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
authors = ["ORBIT Contributors"]
repository = "https://github.com/pietrolama/orbit"
rust-version = "1.80"

[workspace.dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
libc = "0.2.186"
thiserror = "1.0.69"
tempfile = "3.27.0"
blake3 = { version = "1.8", default-features = false, features = ["std", "pure"] }

[profile.dev]
opt-level = 2
